[package]
name = "worktree-boot"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Instant git worktree bootstrap with CoW node_modules, env copy, and port shifting"
authors = ["Augusto Cerrutti <augustocerruttisatto@gmail.com>"]
repository = "https://github.com/kanchingyg/worktree-boot"
readme = "README.md"

[[bin]]
name = "worktree-boot"
path = "src/main.rs"

[lib]
name = "worktree_boot"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
